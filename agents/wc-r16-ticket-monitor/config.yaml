price_threshold_usd: 1500
poll_interval_minutes: 60
alert_cooldown_hours: 24
discord_username: "WC R16 Ticket Monitor"

# Re-alert when price drops by at least this much vs last alert (same event/platform)
price_drop_realert_usd: 50

sources:
  ticketwave: true
  great_reviewer: true   # FIFA official resale via thegreatreviewer.com public API
  stubhub_direct: false  # set true + playwright installed for granular StubHub listings
