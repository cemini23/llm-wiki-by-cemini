# Workspace lazy-tool catalog — used by Cursor MCP (see .cursor/mcp.json).
# Rebuild after tunnel changes:
#   lazy-tool reindex --config .cursor/lazy-tool.yaml
#   bash scripts/lazy_tool_enrich_prod_health.sh   # polymarket/stream health FTS aliases
app:
  name: lazy-tool-osint

storage:
  sqlite_path: ".cursor/lazy-tool-catalog.db"

sources:
  - id: "conductor"
    type: server
    transport: stdio
    command: "python3"
    args:
      - "/Users/claudiobarone/Projects/OSINT WORKSPACE/conductor/mcp_server.py"
  # remote wiki MCP source removed 2026-08-01 (decommissioned 2026-06-14)
  - id: "prod-mcp"
    type: server
    transport: http
    url: "http://localhost:18002/mcp"
  # stash: SSE-only — use global ~/.cursor/mcp.json "stash" (not lazy-tool-indexable)
  - id: "fetch"
    type: server
    transport: stdio
    command: "npx"
    args:
      - "-y"
      - "mcp-fetch-server"
  - id: "exa"
    type: server
    transport: stdio
    command: "/Users/claudiobarone/Projects/OSINT WORKSPACE/scripts/mcp_exa.sh"
    args: []
