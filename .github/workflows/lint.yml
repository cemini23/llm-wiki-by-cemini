name: Wiki Lint

# Runs scripts/wiki_lint.py on push to main + weekly (Monday noon UTC) +
# manual dispatch. Informational only — never gates merges.
#
# The lint script always exits 0; findings are surfaced in the job log
# and posted to the GitHub Actions step summary so the run page renders
# them as a markdown panel.

on:
  push:
    branches: [main]
  schedule:
    # 0 12 * * 1  → every Monday at 12:00 UTC
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  lint:
    # Pinned, not ubuntu-latest: the label migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run wiki lint
        id: lint
        run: |
          set -o pipefail
          python3 scripts/wiki_lint.py | tee lint-output.txt

      - name: Post lint output to step summary
        if: always()
        run: |
          {
            echo "## Wiki lint output"
            echo ""
            echo "Generated by \`scripts/wiki_lint.py\` — informational, non-gating."
            echo ""
            echo '```'
            cat lint-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
