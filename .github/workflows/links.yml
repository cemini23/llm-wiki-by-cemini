name: Markdown Link Check

# Runs tcort/markdown-link-check across wiki/ + briefs/ + root markdown
# monthly + on manual dispatch. NOT on push — link checks make external
# HTTP requests and can be flaky / rate-limited; gating commits on them
# would create noise. Informational only.
#
# Findings are written to link-check-output.txt and posted to the GitHub
# Actions step summary so the run page renders them as a markdown panel.

on:
  schedule:
    # 0 12 1 * *  → 1st of every month at 12:00 UTC
    - cron: '0 12 1 * *'
  workflow_dispatch:

jobs:
  link-check:
    # Pinned, not ubuntu-latest: the label migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install markdown-link-check
        # Pinned to 3.12.2 — 3.13.x has a regression that suppresses output
        # when invoked with -c <config> (silently exits 1 with no stdout).
        run: npm install -g markdown-link-check@3.12.2

      - name: Run link check
        id: linkcheck
        run: |
          set +e
          : > link-check-output.txt
          # Find all markdown files in wiki/, briefs/, and root-level .md files.
          # Skip the .obsidian/ vendored plugin trees. Concat per-file output;
          # always continue so the step summary still posts on dead links.
          mapfile -t files < <(
            find wiki briefs -type f -name '*.md' \
              -not -path '*/.obsidian/*' 2>/dev/null
            find . -maxdepth 1 -type f -name '*.md'
          )
          for f in "${files[@]}"; do
            echo "=== $f ===" >> link-check-output.txt
            markdown-link-check -c .markdown-link-check.json -q "$f" >> link-check-output.txt 2>&1 || true
            echo "" >> link-check-output.txt
          done
          # Summary counts. The "→ Status:" line appears once per dead link
          # (in the ERROR summary block), unlike [✖] which is emitted twice.
          total_files=${#files[@]}
          dead_links=$(grep -c '→ Status:' link-check-output.txt 2>/dev/null || echo 0)
          echo "files_checked=$total_files" >> "$GITHUB_OUTPUT"
          echo "dead_links=$dead_links" >> "$GITHUB_OUTPUT"

      - name: Post link-check output to step summary
        if: always()
        run: |
          {
            echo "## Markdown link-check output"
            echo ""
            echo "Files checked: **${{ steps.linkcheck.outputs.files_checked }}**"
            echo "Dead links found: **${{ steps.linkcheck.outputs.dead_links }}**"
            echo ""
            echo "Generated by \`tcort/markdown-link-check\` — informational, non-gating."
            echo ""
            echo '```'
            head -c 60000 link-check-output.txt
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
