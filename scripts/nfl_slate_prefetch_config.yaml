# NFL slate prefetch — gambling-wiki (W8 in-season)
#
# Hourly LaunchAgent runs nfl_slate_prefetch_run.py during NFL season.
# Writes data stubs → briefs/slate-prefetch/ for Cursor hub completion.
#
# See: wiki/meta/nfl-slate-prefetch-cadence.md
# Hub workflow: wiki/concepts/nfl-weekly-slate-hub-workflow.md

timezone: America/New_York

# null = infer from calendar year (Sep–Feb → current or prior season)
season_override: null

# nflverse games.csv (no API key)
schedule_url: https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv

output:
  dir: briefs/slate-prefetch
  hub_brief_dir: briefs

# When to materialize prefetch files (hours before first kickoff of slate)
slate_passes:
  thu:
    label: Thursday Night Football
    passes:
      - { id: early, hours_before: 30, tolerance_hours: 1.0 }
      - { id: final, hours_before: 2.0, tolerance_hours: 0.5 }
  sun:
    label: Sunday main slate
    passes:
      - { id: early, hours_before: 20, tolerance_hours: 1.5 }
      - { id: final, hours_before: 1.5, tolerance_hours: 0.5 }
  snf:
    label: Sunday Night Football
    passes:
      - { id: early, hours_before: 6, tolerance_hours: 1.0 }
      - { id: final, hours_before: 1.5, tolerance_hours: 0.5 }
  mnf:
    label: Monday Night Football
    passes:
      - { id: early, hours_before: 26, tolerance_hours: 1.5 }
      - { id: final, hours_before: 1.5, tolerance_hours: 0.5 }

# Optional: Open-Meteo wind for outdoor games (requires stadium table below)
weather:
  enabled: true
  forecast_hours_before_kick: 3

# Minimal roof/outdoor + lat/lon for weather (subset; extend as needed)
