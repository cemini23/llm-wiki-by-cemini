  Read wiki/concepts/nfl-weekly-slate-hub-workflow.md.
  Fill injury, narrative, and cross-lane flags; write briefs/{season}-w{week}-slate-hub-{slate}.md
  Then list tool sessions to run (FanDuel, Hard Rock, Underdog Pick'em).
