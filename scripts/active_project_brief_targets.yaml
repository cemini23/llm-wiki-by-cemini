# Active project brief routing — read on every full ingest (2026-06-20 pivot)
#
# Agents: before staging a prod brief to cemini-prod, check whether the source
# maps to an active project below. Default = wiki-only unless a row says scp.
#
# Sync with ROADMAP.md "Active workstreams" and scripts/daily_research_config.yaml
# Eval: CCC prompts/deep-research-multi-wiki-eval-v10-2026-07-06.md (v10.6)
#
# Operator priority (2026-10-05): Atto = #1 · GuruWatcher + Basgiath = #2 (co-primary) · CeminiDFS = #3 · CeminiParlays = #4 · then wikis.
# Basgiath registered 2026-10-04: Minecraft Bedrock add-on, fan project, MCPEDL + CurseForge.
# Poker arena retired 2026-09-13. TipDrop / David kit briefs retired 2026-08-05.

default_posture: wiki-only

# Priority #1 / #2 — morning ingest first. Genealogy productizable → atto briefs
# (`../atto/briefs`). Local abliterated / operator-lab → Cybersecurity wiki briefs.
# Private Barone digs → family-tree only. Newsletter/price-watch Discord → guruwatcher.
projects:
  atto:
    label: "Atto — Italian civil-record genealogy agent kit (public product)"
    code_root: "../atto"
    wiki: "@osint-wiki/concepts/gpuology-genealogy-agent-kit.md"
    brief_dir: "../atto/briefs"
    scp_target: null
    co_primary: true
    priority_rank: 1
    primary_goal: "Ship Atto kit/concierge/Access share/playbook — productize Barone process (M1–M14 + FIND/AI/MCP)"
    steal_from:
      - "GEDCOM / Gramps truth layer; human-gated merge; PII vault + secret-strip before LLM"
      - "Antenati IIIF local-only download; FamilySearch / Ancestry portal cassettes"
      - "Transkribus HTR (no LLM-NAS); Tint GPL isolate; Italian civil/parish playbook + FIND deep-links"
      - "Cloudflare Pages + Access redacted share; jure sanguinis concierge pack"
      - "Genealogy MCP / Cursor skill harness (atto-mcp allowlist pattern)"
      - "Entity resolution, codice fiscale, regional archive priors (Abruzzo/Calabria/Trentino)"
    skip_brief_if:
      - "Private Barone / living-person pedigree or DNA (→ Desktop/family/research only; never Atto fixtures)"
      - "Generic genealogy affiliate content with no reproducible archive or product module gap"
      - "Minecraft / Bedrock content (→ basgiath briefs)"
      - "Godot/RTS/game-dev content unless castle-sim explicitly reopened"

  guruwatcher:
    label: "GuruWatcher — alert-only newsletter parameter watches → Discord"
    code_root: "../GuruWatcher"
    wiki: null
    brief_dir: "../GuruWatcher/briefs"
    scp_target: null
    co_primary: true
    priority_rank: 2
    primary_goal: "Arm Macro Charts (etc.) price/level watches, reconcile most-recent-wins claims, Discord alert-only on cemini-prod (no orders)"
    steal_from:
      - "Newsletter / Macro Charts claim extract → armed watches (fluid mind, most-recent-wins)"
      - "Discord alert-only price/level bots (no order placement)"
      - "Unusual Whales OHLC + yfinance fallback polling; VIX/DXY/WTI/index levels"
      - "Claim ledger reconcile vs prod watches.json; inbox → ingest-issue hooks"
      - "systemd timer / prod deploy packs for alert monitors"
    skip_brief_if:
      - "Order-routing / live execution bots (GuruWatcher is alert-only)"
      - "Generic Discord SaaS onboarding without price-watch or newsletter-claim hook"
      - "Genealogy / Atto product content"
      - "Minecraft / Bedrock content (→ basgiath briefs)"

  basgiath:
    label: "Basgiath — Minecraft Bedrock add-on, Empyrean/dragon-rider theme (fan project)"
    code_root: "../dragon-rider-map"
    wiki: "@osint-wiki/concepts/k281-basgiath-wave.md"
    brief_dir: "../dragon-rider-map/briefs"
    scp_target: null
    co_primary: true
    priority_rank: 2
    primary_goal: "Ship the Basgiath world and add-on to MCPEDL and CurseForge; build an unattended test bench so a release validates without a human clicking through Minecraft"
    steal_from:
      - "Bedrock LevelDB NBT read/write for offline inventory and player-state assertions"
      - "Headless container lifecycle for world-gen, behavior-pack load, and spawn assertions"
      - "MCP automation over a running Bedrock client for checks a container cannot make"
      - "Bedrock XUID and Java UUID player-identity rendering for scoreboards and Discord embeds"
      - "Blockbench 3D typography and isometric tile pipelines for promotional art"
    skip_brief_if:
      - "Monetization of the add-on (this is a non-monetized fan project)"
      - "Client-modification code, anticheat evasion, or hacked-client tooling — out of scope at every priority"
      - "Generic Bedrock or Mojang platform news with no test-bench, distribution, or content hook"

  ceminidfs:
    label: "CeminiDFS — DIY NFL projection pipeline (FanDuel-primary)"
    code_root: "../CeminiDFS"
    wiki: "@gambling-wiki/concepts/diy-nfl-dfs-model-architecture.md"
    brief_dir: "../CeminiDFS/briefs"
    scp_target: null
    co_primary: true
    priority_rank: 3
    primary_goal: "NFL DFS contest ROI + BBM draft copilot — projection/lineup/sim only"
    steal_from:
      - "nflverse PBP → volume/usage/stat projection layers"
      - "Vegas implied team totals, weather adjustments, injury workflow"
      - "Ownership projection, copula/sim rerank, late-swap pydfs integration"
      - "Backtest/calibration vs Stokastic/FantasyLabs paid benchmarks"
      - "FanDuel slate strategy, stacking/correlation, MME pool generation"
      - "Underdog Best Ball Mania exposure ledger / draft recommender"
    skip_brief_if:
