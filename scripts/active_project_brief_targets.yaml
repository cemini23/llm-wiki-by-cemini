# Active project brief routing — read on every full ingest (2026-06-20 pivot)
#
# Agents: before staging a prod brief to cemini-prod, check whether the source
# maps to an active project below. Default = wiki-only unless a row says scp.
#
# Sync with ROADMAP.md "Active workstreams" and scripts/daily_research_config.yaml
# Eval: CCC prompts/deep-research-multi-wiki-eval-v10-2026-07-06.md (v10.3 Atto)

default_posture: wiki-only

# Co-primary — morning ingest priority. Atto is operator Priority #1 product
# (2026-07-21); other co_primary rows stay active. Genealogy productizable →
# atto briefs; private Barone digs → family-tree only.
projects:
  atto:
    label: "Atto — Italian civil-record genealogy agent kit (public product)"
    code_root: "../atto"
    wiki: "@osint-wiki/concepts/gpuology-genealogy-agent-kit.md"
    brief_dir: "../atto/briefs"
    scp_target: null
    co_primary: true
    priority_rank: 1
    primary_goal: "Ship Atto kit/concierge/Access share/playbook — productize Barone process (M1–M14 + FIND/AI/MCP)"
    steal_from:
      - "GEDCOM / Gramps truth layer; human-gated merge; PII vault + secret-strip before LLM"
      - "Antenati IIIF local-only download; FamilySearch / Ancestry portal cassettes"
      - "Transkribus HTR (no LLM-NAS); Tint GPL isolate; Italian civil/parish playbook + FIND deep-links"
      - "Cloudflare Pages + Access redacted share; jure sanguinis concierge pack"
      - "Genealogy MCP / Cursor skill harness (atto-mcp allowlist pattern)"
      - "Entity resolution, codice fiscale, regional archive priors (Abruzzo/Calabria/Trentino)"
    skip_brief_if:
      - "Private Barone / living-person pedigree or DNA (→ Desktop/family/research only; never Atto fixtures)"
      - "Generic genealogy affiliate content with no reproducible archive or product module gap"
      - "Godot/RTS/game-dev content unless castle-sim explicitly reopened"

  poker-arena:
    label: "dev.fun Poker Arena (cemini_decide)"
    code_root: "agents/devfun-poker-arena"
    wiki: "@gambling-wiki/concepts/poker-hl-analyst-loop.md"
    brief_dir: "agents/devfun-poker-arena/briefs"
    scp_target: null
    co_primary: true
    primary_goal: "dev.fun Poker Agent Challenge — researcher track sandbox LB (HU), Jun 21 beta"
    steal_from:
      - "Researcher Round HU sandbox — trajectory, TrueSkill, nine-axis eval (2606.13815)"
      - "MAFP fictitious play, multi-agent equilibrium learning (2606.19308)"
      - "Generator-verifier inference steering for decide() (VERITAS / K123–K124 cluster)"
      - "6-max preflop discipline, HUD exploit, blind pressure, tournament ICM"
      - "Heads-up gin lanes, BenchFlow sandbox submit, opponent modeling, F6+ memory"
      - "Regression spots + HL analyst loop leaks"
    skip_brief_if:
      - "Casino slots / sportsbook unrelated to arena-pokerkit"
      - "Legacy CeminiSuite conductor eval unless poker-session tooling"

  ceminidfs:
    label: "CeminiDFS — DIY NFL projection pipeline (FanDuel-primary)"
    code_root: "../projects/CeminiDFS"
    wiki: "@gambling-wiki/concepts/diy-nfl-dfs-model-architecture.md"
    brief_dir: "../projects/CeminiDFS/briefs"
    scp_target: null
    co_primary: true
    steal_from:
      - "nflverse PBP → volume/usage/stat projection layers"
      - "Vegas implied team totals, weather adjustments, injury workflow"
      - "Ownership projection, copula/sim rerank, late-swap pydfs integration"
      - "Backtest/calibration vs Stokastic/FantasyLabs paid benchmarks"
      - "FanDuel slate strategy, stacking/correlation, MME pool generation"
    skip_brief_if:
      - "NBA/other-sport DFS unless NFL methodology transfer explicit"
      - "Paid-tool affiliate content without reproducible methodology"

  xsp-killer:
    label: "XSP killer bot — Robinhood long-call lanes A/B"
    code_root: null
    wiki: "@osint-wiki/concepts/xsp-lane-trading-framework.md"
    brief_dir: "briefs"
    scp_target: "cemini-prod:/opt/cemini/briefs/"
    brief_name_prefix: "xsp-"
    co_primary: true
    steal_from:
      - "XSP / Mini-SPX options flow, LEAPS inventory, put-hedge rolls"
      - "Index vol regime gates (GREEN playbook_snapshot)"
      - "Overnight swing exit rules, delta-adjusted scoring"
    skip_brief_if:
      - "SMB short put credit unless contrast-noted"

  family-tree:
    label: "Family-tree / Barone dogfood (private — feeds Atto methodology)"
    code_root: null
    private_research_dir: "~/Desktop/family/research"
    wiki: "@osint-wiki/concepts/computational-genealogy-archival-automation.md"
    brief_dir: null
    scp_target: null
    co_primary: true
    primary_goal: "Archival depth 1500s–present; jure sanguinis document chains; brick-wall breakthroughs (private — no prod scp; no Atto fixtures)"
    steal_from:
      - "Private town sprints, pedigree digs, living-person vitals (Desktop/family only)"
