    code_root: "../projects/Image gen"
    wiki: "@image-gen-wiki/concepts/david-adoption-brief-routing.md"
    brief_dir: "../projects/tipdrop-workspace-kit/briefs"
    brief_name_suffix: "-david"
    scp_target: null
    co_primary: false
    primary_goal: "Mirror Phase-0 adoption briefs for David's ComfyUI / Fish-Speech persona stack"
    steal_from:
      - "ComfyUI custom nodes, FLUX/Wan LoRA adoption, pose transfer, interactive refine"
      - "Fish-Speech + LatentSync production stack decisions"
      - "Persona video energy / DCAL LoRA methodology"
