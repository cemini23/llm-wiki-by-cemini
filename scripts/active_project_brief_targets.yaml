    code_root: "../CeminiParlays"
    wiki: "@gambling-wiki/concepts/parlay-and-correlated-bets.md"
    brief_dir: "../CeminiParlays/briefs"
    scp_target: null
    co_primary: true
    priority_rank: 4
    primary_goal: "Rank operator-typed Hard Rock (etc.) parlay / SGP tickets vs displayed American; pick'em second profile; no scrape / no auto-submit"
    steal_from:
      - "Same-game parlay / SGP EV vs displayed American"
      - "De-vig two-way book markets; Gaussian copula joint hit rate"
      - "Underdog / PrizePicks pick'em slip ranking (second profile)"
      - "Injury scratch tokens; fail-closed line validation"
    skip_brief_if:
      - "NFL DFS projection / lineup optimizer / BBM (→ ceminidfs)"
      - "Scrape / auto-bet / auto-submit sportsbook tooling"
      - "Poker arena / GTO solver (product retired 2026-09-13)"

  xsp-killer:
