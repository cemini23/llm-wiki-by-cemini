loop:
  recency_window_days: 14
  max_results_per_query: 3
fetch:
  enabled: true
  max_downloads: 8
  fetch_likely: true
  max_results_per_paper_query: 3
  sources:
  - arxiv
  - openreview
arxiv_fallback:
  enabled: true
  request_interval_seconds: 3
  max_terms_per_query: 4
exa:
  news_enabled: false
  paper_mode: arxiv-only
  include_domains:
  - arxiv.org
  search_type: auto
active_topics:
- Poker & arena bots (W6) — Researcher Round HU sandbox (Jun 21 β), MAFP/verifier steals, dev.fun decide(),
  HL loop (→ OSINT agents/devfun-poker-arena/briefs/)
- CeminiDFS (W9/K125) — nflverse projection, ownership sim, pydfs MME, calibration vs Stokastic (→ ../projects/CeminiDFS/briefs/)
- K147 pick'em/props (W10) — PrizePicks/UD fair value, slip EV, manual line workflow (→ wiki/concepts/diy-nfl-pickem-props-tool-architecture.md)
- NFL 2026 season prep (W8) — Hard Rock +EV/CLV, FanDuel DFS GPP, Underdog/BBM7, props correlation
- DFS / best ball — BBM7, Underdog ADP movers, roster construction, ownership leverage
- Sports betting — +EV process, CLV, line shopping, NFL spreads/props, sharp vs soft books
- Bankroll & Kelly — fractional sizing, variance, responsible-gambling guardrails
- Gambling bot program — FOSS evals, API/ToS, per-platform lanes (W4)
- Prediction markets retail — Kalshi/Polymarket fees, FLB, cross-venue vs books
- World Cup 2026 — retail wagering, books vs PM divergence; ticket resale cross-ref @osint-wiki wc-ticket-monitor
brief_routing_note: 'Co-primary ingest (equal priority): poker-arena · ceminidfs.

  Full ingest briefs route per `scripts/active_project_brief_targets.yaml`.

  poker-arena → OSINT agents/devfun-poker-arena/briefs/ · CeminiDFS → ../CeminiDFS/briefs/

  nfl-w8 → briefs/ (wiki-only). Prod bot deploy stays @osint-wiki.

  '
paper_queries:
- cluster: poker-exploit-arxiv
  query: arxiv poker OR holdem OR texas holdem exploit suboptimal opponent imperfect information
  category: research paper
  arxiv_query: (all:poker OR all:holdem OR all:"texas hold") AND (all:exploit OR all:CFR OR all:"opponent
    modeling" OR all:"imperfect information")
- cluster: poker-mafp-arxiv
  query: arxiv multi-agent fictitious play poker game theory equilibrium
  category: research paper
  arxiv_query: (all:"fictitious play" OR all:MAFP) AND (all:poker OR all:game OR all:equilibrium)
- cluster: sports-betting-arxiv
  query: arxiv sports betting wagering odds market efficiency closing line value bookmaker
  category: research paper
  arxiv_query: (all:"sports betting" OR all:bookmaker OR all:"closing line") AND (all:wager OR all:odds
    OR all:betting OR all:efficiency)
- cluster: cemini-dfs-nflverse-paper
  query: arxiv nflverse play-by-play NFL player usage projection fantasy football python
  category: research paper
  arxiv_query: (all:nflverse OR all:"play-by-play" OR all:"fantasy football") AND (all:NFL OR all:projection
    OR all:fantasy)
- cluster: cemini-dfs-ownership-paper
  query: arxiv daily fantasy sports ownership projection simulation copula monte carlo GPP
  category: research paper
  # K162: drop bare all:ownership (Rust ownership / GenAI authorship / EV bleed). Require DFS anchors.
  arxiv_query: (all:"daily fantasy" OR all:DraftKings OR all:FanDuel OR all:"fantasy sports") AND (all:ownership
    OR all:GPP OR all:lineup OR all:copula OR all:projection) AND (all:simulation OR all:NFL OR all:fantasy
    OR all:contest)
- cluster: kelly-bankroll-arxiv
  query: arxiv Kelly criterion sports betting bankroll wager sizing gambling
  category: research paper
  # K165: require wagering anchors; ANDNOT neural bits-per-spike / neuroscience Kelly-metaphor bleed.
  arxiv_query: (all:Kelly OR all:"bankroll" OR all:"Kelly criterion") AND (all:betting OR all:wager OR all:gambling
    OR all:odds) AND (all:sports OR all:bookmaker OR all:bankroll OR all:fractional OR all:"closing line"
    OR all:criterion) ANDNOT (all:spike OR all:neuron OR all:neuroscience OR all:thalamic)
queries:
- cluster: poker-arena-bots
  query: '"dev.fun" OR "arena pokerkit" OR poker agent challenge researcher track heads-up sandbox 2026'
  category: news
- cluster: poker-hu-exploit
