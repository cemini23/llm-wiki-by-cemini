monokern_pipeline:
  enabled: true
  cadence: weekly
  default_deliverable: none
  source_modules:
  - yt-dlp
  - inbox_pdf
  - web_url
  ingest_hook: After weekly digest, one NotebookLM pass on co-primary topic (W6 poker Researcher Round,
    W9 CeminiDFS, or W8 NFL)
social:
  manual_pass:
  - tool: opencli-reader
    prompt: Reddit r/poker + dev.fun arena Researcher Round HU; r/dailyfantasysports NFL; r/sportsbook
      last 24h
  - tool: twitter-reader
    prompt: dev.fun poker HU sandbox MAFP verifier; NFL DFS FanDuel pydfs; Underdog BBM7 ADP last 24h
