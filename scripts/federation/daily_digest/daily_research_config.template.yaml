# Wiki-local daily digest config — copy to scripts/daily_research_config.yaml and edit topics.
# Parent reference: OSINT scripts/daily_research_config.yaml
#
# Exa cost control (2026-07-15): default to free arXiv for papers; news lane off.
# Search is billed ~$7/1k requests — prefer fewer queries over lower numResults.

loop:
  recency_window_days: 3
  max_results_per_query: 3

fetch:
  enabled: true
  max_downloads: 5
  fetch_likely: false
  max_results_per_paper_query: 3

arxiv_fallback:
  enabled: true
  request_interval_seconds: 3
  max_terms_per_query: 6

exa:
  news_enabled: false
  paper_mode: arxiv-only  # arxiv-only | arxiv-first | exa-first | exa-only
  include_domains:
    - arxiv.org
  search_type: auto  # never deep / deep-reasoning for digest

# EDIT: domain topics for this wiki only
active_topics:
  - "Replace with ROADMAP workstream 1"
  - "Replace with ROADMAP workstream 2"

paper_queries:
  - cluster: domain-paper-1
    query: "research paper <your domain keywords>"
    category: research paper

# Retained for re-enable; skipped while exa.news_enabled=false
queries:
  - cluster: domain-news-1
    query: "<news query for this wiki>"
    category: news

# Weekly Monokern-style deep research (optional)
monokern_pipeline:
  enabled: true
  cadence: weekly  # daily | weekly
  default_deliverable: none  # infographic | mindmap | audio | none
  source_modules:
    - yt-dlp
    - inbox_pdf
    - web_url
  skill_notes: "Use notebooklm-osint-bridge + skill-creator; laptop auth only."

social:
  manual_pass:
    - tool: opencli-reader
      prompt: "Domain-relevant frontpage / feeds last 24h"

# Optional federation-wide Agent Reach/OpenCLI lane.
# Requires Agent Reach install pack on the operator laptop. Output stays under
# `.local/agent-reach-daily/{date}/` and is rendered into the daily digest as
# review-only social candidates. No wiki ingest or prod handoff is automatic.
agent_reach_social:
  enabled: false
  timeout_seconds: 45
  max_items_per_query: 5
  allowlist: "config/agent_reach_daily_sources.example.json"
  queries:
    - cluster: domain-x
      platform: twitter
      command: ["opencli", "twitter", "search", "<domain query>", "-f", "yaml"]
    - cluster: domain-reddit
      platform: reddit
      command: ["opencli", "reddit", "search", "<domain query>", "-f", "yaml"]
    - cluster: domain-instagram
      platform: instagram
      command: ["opencli", "instagram", "profile", "<account>", "-f", "yaml"]

output:
  path_template: "wiki/sweeps/{date}-daily.md"
