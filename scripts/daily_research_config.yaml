monokern_pipeline:
  enabled: true
  cadence: weekly
  default_deliverable: none
  source_modules:
    - yt-dlp
    - inbox_pdf
    - web_url
  ingest_hook: "After Sunday digest, one NotebookLM pass on Priority #1/#2 or active topic (Atto, GuruWatcher, poker, ceminiDFS, xsp-killer, family-tree dogfood, local abliterated lab, or PM)"

social:
  manual_pass:
    - tool: notebooklm-osint-bridge
      prompt: "Weekly Monokern pass — prefer Atto (#1) or GuruWatcher (#2); else poker Researcher Round, ceminiDFS, xsp-killer, local abliterated lab, family-tree dogfood, or PM/Kalshi"
    - tool: twitter-reader
      prompt: "dev.fun poker HU sandbox; XSP Mini-SPX LEAPS/options flow; NFL DFS FanDuel; local abliterated LLM / pentest harness; PM/Kalshi bot last 24h"
    - tool: opencli-reader
      prompt: "HN poker AI dev.fun arena OR r/poker heads-up; local LLM Ollama vLLM abliterated; WC tickets; prediction market bot"
    - tool: telegram-reader
      prompt: "PM/crypto macro + options vol + WC ticket/resale headlines"

agent_reach_social:
