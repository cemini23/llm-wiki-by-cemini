  timeout_seconds: 45
  max_items_per_query: 5
  allowlist: "config/agent_reach_daily_sources.example.json"
  note: "Optional DRY_RUN social lane. OpenCLI results are normalized by scripts.agent_reach_wrapper and written to .local/agent-reach-daily/{date}/."
  queries:
    - cluster: x-agent-research
      platform: twitter
      command: ["opencli", "twitter", "search", "AI agents OR Claude Code OR Cursor agents", "-f", "yaml"]
    - cluster: x-prediction-markets
      platform: twitter
      command: ["opencli", "twitter", "search", "Polymarket OR Kalshi OR prediction market bot", "-f", "yaml"]
