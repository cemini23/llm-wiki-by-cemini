      command: ["opencli", "reddit", "search", "AI agents production workflows", "-f", "yaml"]
    - cluster: reddit-prediction-markets
      platform: reddit
      command: ["opencli", "reddit", "search", "Polymarket Kalshi prediction markets", "-f", "yaml"]
output:
