# Daily research digest — discovery + optional arXiv fetch to inbox
#
# Steal-from: tier25_config.yaml + weekly_arxiv_sweep.sh
# Read by: daily_research_digest_run.py
#
# Update `active_topics` when ROADMAP.md workstreams shift.
# Brief routing: scripts/active_project_brief_targets.yaml
# Overnight: non-duplicate arXiv PDFs land in `research to be indexed/` for morning "full ingest".
#
# Exa cost control (2026-07-15): after free credits, prefer free arXiv for papers.
# Flip paper_mode to arxiv-first / exa-first only when you want paid enrichment.

loop:
  # 14d lookback — wiki/inbox dedupe still prevents re-fetch; 3d starved arXiv keyword search.
  recency_window_days: 14
  max_results_per_query: 3

fetch:
  enabled: true
  max_downloads: 8
  fetch_likely: false
  max_results_per_paper_query: 3

# Free arXiv Atom API — primary paper discovery under exa.paper_mode=arxiv-only
arxiv_fallback:
  enabled: true
  request_interval_seconds: 3
  max_terms_per_query: 4

# Pay-per-use Exa (~$7/1k searches). Default: zero Exa on paper+news lanes.
exa:
  news_enabled: false
  paper_mode: arxiv-only  # arxiv-only | arxiv-first | exa-first | exa-only
  include_domains:
    - arxiv.org
  search_type: auto  # never deep / deep-reasoning for digest

# Priority stack (2026-07-27) — morning ingest for active codebases.
# Atto = Priority #1 · GuruWatcher = Priority #2 · everything else behind.
# Route briefs per scripts/active_project_brief_targets.yaml; wiki always.
active_topics:
  - "Atto — genealogy agent kit Priority #1 (vault/truth/FIND/portals/share/MCP) (→ ../atto/briefs/ + @osint-wiki methodology)"
  - "GuruWatcher — Priority #2 alert-only newsletter parameter watches → Discord (→ ../GuruWatcher/briefs/ + Macro Charts inbox hook)"
  - "CeminiDFS — Priority #3 NFL projection pipeline, nflverse calibration, ownership sim, pydfs MME, BBM (→ @gambling-wiki + ../CeminiDFS/briefs/)"
  - "CeminiParlays — Priority #4 NFL sportsbook parlay / SGP EV + pick'em (→ @gambling-wiki + ../CeminiParlays/briefs/)"
  - "XSP killer bot — Lane A overnight exits + Lane B LEAPS hedge monitor on Robinhood (→ briefs/xsp-* → cemini-prod)"
  - "Family-tree / Barone dogfood — private archival digs only (→ ~/Desktop/family/research/; productizable → Atto)"
  - "wc-ticket-monitor — FIFA WC26 knockout resale alerts (secondary — route when source matches)"
  - "PM / Kalshi retail bot — CLOB botting, cross-venue, maker/taker postmortems (exploratory)"
  - "Local abliterated AI lab — low-refusal local LLM + owned whitehat lab / pentest harness (→ @cybersec-wiki briefs)"
  - "Agent harness for game dev — Cursor/Stagehand, not prod conductor KPIs (poker product retired)"
  - "/route + agent-toolkit — lane failover, SIP/verify, Grok/claude-ds hang recovery, harness evolution from _route_runs (→ CCC briefs + @ccc-wiki/entities/skills/route.md backlog)"

brief_routing_note: |
  Priority #1: atto (../atto/briefs/). Priority #2: guruwatcher (../GuruWatcher/briefs/).
  Priority #3: ceminidfs (../CeminiDFS/briefs/). Priority #4: ceminiparlays (../CeminiParlays/briefs/). Then wikis.
  Behind #1–#4 (route when source matches): xsp-killer · family-tree (dogfood) · local-abliterated-lab · pm-kalshi-bot · wc-ticket-monitor · castle-sim (legacy).
  Poker arena retired 2026-09-13 — do not route to agents/devfun-poker-arena/briefs/.
  Full ingest briefs route per `scripts/active_project_brief_targets.yaml`.
  Genealogy split: productizable (HTR/GEDCOM/vault/share/MCP/portal) → Atto dedicated brief; private pedigree → Desktop/family only.
  Newsletter / Macro Charts price-level watches → GuruWatcher (alert-only; never order routing).
  NFL DFS projection / lineup / BBM → CeminiDFS. Sportsbook parlay / SGP / pick'em EV → CeminiParlays (do not merge stacks).
  Local abliterated / operator-lab: ../Cybersecurity wiki/briefs/ (never tipdrop-workspace-kit — TipDrop/David retired 2026-08-05).
  Do NOT default prod scp to cemini-prod for generic quant-finance / MAPPO / Riskfolio papers.
  atto → ../atto/briefs/ · guruwatcher → ../GuruWatcher/briefs/ · ceminidfs → ../CeminiDFS/briefs/ · ceminiparlays → ../CeminiParlays/briefs/
  xsp-killer → briefs/xsp-* → cemini-prod · family-tree → ~/Desktop/family/research/ (private; wiki methodology only)
  local-abliterated-lab → ../Cybersecurity wiki/briefs/
  wc-ticket-monitor → ../projects/wc-ticket-monitor/briefs/ (wiki-only unless ticket-resale hook).
  /route · agent-toolkit · SIP/verify · executor failover / hang recovery · harness-evolution-from-trajectories → CCC briefs (`../Cemini claude code CCC/briefs/`) + bump route skill backlog; never TipDrop kit.

# arXiv / research-paper lane — deduped against wiki; PDFs → inbox when NEW
# Use `arxiv_query` (Atom syntax) for reliable free discovery; `query` stays human-readable.
paper_queries:
  - cluster: poker-agent-paper
    query: "research paper poker reinforcement learning opponent modeling imperfect information game"
    arxiv_query: '(all:poker OR all:holdem OR all:"texas hold") AND (all:reinforcement OR all:CFR OR all:"opponent modeling" OR all:"imperfect information")'
    category: research paper

  - cluster: poker-mafp-fictitious-play-paper
    query: "research paper multi-agent fictitious play poker game theory equilibrium learning"
    arxiv_query: '(all:"fictitious play" OR all:MAFP) AND (all:poker OR all:game OR all:equilibrium OR all:"multi-agent")'
    category: research paper

  - cluster: options-index-paper
    query: "research paper index options LEAPS volatility surface mini-SPX XSP hedging"
    arxiv_query: '(all:option OR all:options) AND (all:volatility OR all:hedging OR all:LEAPS OR all:"implied volatility")'
    category: research paper

  - cluster: genealogy-archive-paper
    query: "research paper genealogy archival handwriting recognition IIIF GEDCOM entity resolution historical records"
    arxiv_query: 'all:genealogy OR all:GEDCOM OR all:IIIF OR all:"handwriting recognition" OR all:"historical document" OR all:HTR'
    category: research paper

  - cluster: agent-harness-paper
    query: "research paper LLM agent harness playtesting verification game development OR poker"
    arxiv_query: '(all:agent AND (all:harness OR all:playtest OR all:verification)) OR (all:LLM AND all:agent AND (all:game OR all:poker))'
    category: research paper

  # Standing steal for federation /route + agent-toolkit (K232 SHE / failover ops)
  - cluster: cursor-route-harness
    query: "research paper LLM agent task router harness failover SIP verification trajectory safety tool policy"
    arxiv_query: '(all:agent AND (all:harness OR all:router OR all:failover OR all:"tool policy" OR all:"safety memory")) AND (all:LLM OR all:"language model" OR all:trajectory)'
    category: research paper

  - cluster: local-abliterated-llm-paper
    query: "research paper local LLM inference abliteration refusal reduction pentest assist open-weight agent"
    arxiv_query: '(all:abliteration OR all:"refusal" OR all:"uncensored") AND (all:LLM OR all:"language model") OR (all:local AND all:LLM AND (all:pentest OR all:vLLM OR all:Ollama))'
    category: research paper

  - cluster: nfl-dfs-projection-paper
    query: "research paper NFL daily fantasy sports player projection ownership simulation FanDuel DraftKings"
    # Never bare "DFS" — matches depth-first search on arXiv.
    arxiv_query: '(all:"daily fantasy" OR all:DraftKings OR all:FanDuel OR all:"fantasy football") AND (all:NFL OR all:projection OR all:ownership OR all:lineup)'
    category: research paper

  - cluster: nfl-parlay-sgp-paper
    query: "research paper NFL same-game parlay correlation copula sportsbook vig pick'em"
    arxiv_query: '(all:parlay OR all:SGP OR all:"same-game") AND (all:NFL OR all:sportsbook OR all:correlation OR all:copula)'
    category: research paper

