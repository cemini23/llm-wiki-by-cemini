# Daily research digest — discovery + optional arXiv fetch to inbox
#
# Steal-from: tier25_config.yaml + weekly_arxiv_sweep.sh
# Read by: daily_research_digest_run.py
#
# Update `active_topics` when ROADMAP.md workstreams shift.
# Overnight: non-duplicate arXiv PDFs land in `research to be indexed/` for morning "full ingest".

loop:
  recency_window_days: 7
  max_results_per_query: 3

fetch:
  enabled: true
  max_downloads: 8
  # Only auto-download hits that are NEW vs wiki/inbox (not LIKELY fuzzy title matches)
  fetch_likely: false
  max_results_per_paper_query: 5

active_topics:
  - "World Cup bot — shadow soak, LP safety DR 2026-06-06"
  - "K89 wave 3b — PM executor wiki enforcement on prod"
  - "Prediction markets — LP rewards, cross-venue, weather bots"
  - "Agent tooling — Cursor skills, conductor, kb-server"
  - "Wiki→prod loop — brief completion + lesson registry (K89)"

# arXiv / research-paper lane — deduped against wiki; PDFs → inbox when NEW
paper_queries:
  - cluster: prediction-markets-paper
    query: "research paper prediction market microstructure Polymarket Kalshi event contract"
    category: research paper

  - cluster: agent-harness-paper
    query: "research paper LLM coding agent harness orchestration MCP tool use"
    category: research paper

  - cluster: quant-finance-paper
    query: "research paper algorithmic trading reinforcement learning market microstructure"
    category: research paper

  - cluster: financial-rl-paper
    query: "research paper reinforcement learning portfolio optimization execution"
    category: research paper

# Web/news — listed in digest only (not auto-downloaded)
queries:
  - cluster: prediction-markets
    query: '"Polymarket" OR "Kalshi" prediction market bot OR LP rewards OR event contract trading'
    category: news

  - cluster: world-cup-pm
    query: '"World Cup 2026" OR FIFA prediction market OR advance market Polymarket Kalshi'
    category: news

  - cluster: agent-harness
    query: '"AI agent" OR "Claude Code" OR MCP workflow OR agent harness observability'
    category: news

# Weekly Monokern-style pipeline — Cursor + notebooklm-osint-bridge (see @concepts/monokern-compounding-research-pipeline.md)
monokern_pipeline:
  enabled: true
  cadence: weekly
  default_deliverable: none
  source_modules:
    - yt-dlp
    - inbox_pdf
    - web_url
  ingest_hook: "After Sunday digest, run one /yt-pipeline or notebooklm brief on top active_topic"

social:
  manual_pass:
    - tool: notebooklm-osint-bridge
      prompt: "Weekly Monokern pass on top ROADMAP topic — 10 sources, vault markdown"
    - tool: twitter-reader
      prompt: "Search fintwit for Polymarket, Kalshi, agent tooling from last 24h"
    - tool: opencli-reader
      prompt: "HackerNews / arXiv frontpage for quant + agent harness"
    - tool: telegram-reader
      prompt: "Financial Telegram channels — PM/crypto macro headlines"

output:
  path_template: "wiki/sweeps/{date}-daily.md"
