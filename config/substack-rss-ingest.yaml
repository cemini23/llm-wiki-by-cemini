# Substack / finance newsletter RSS → research to be indexed/
#
# Free-tier posts only (paid content needs email forward path like Macro Charts).
# Phase 4: wiki writes stay human-gated in Cursor.
#
# Poll: bash scripts/run_substack_rss_poller.sh
# Setup LaunchAgent: bash scripts/setup_macro_charts_email_ingest.sh (installs RSS + Gmail agents)

poll_interval_seconds: 1800
max_age_days: 7
user_agent: "CeminiOSINT-SubstackRSS/1.0"

state:
  posts_registry: ".local/state/substack-rss-posts.json"

feeds:
  - id: macrocharts
    name: Macro Charts
    feed_url: https://www.macrocharts.com/feed
    filename_prefix: macro-charts-rss
    max_age_days: 14
    tags: [macro, technical-analysis, substack]
    enabled: true

  - id: klement
    name: Klement on Investing
    feed_url: https://klementoninvesting.substack.com/feed
    filename_prefix: substack-rss-klement
    tags: [macro, prediction-markets, research]
    cross_wiki: [gambling-wiki]
    enabled: true

