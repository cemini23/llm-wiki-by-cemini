# ICE turnkey thesis — facility hiring monitor
# Package: scripts/intel/monitors/jobs.py
# Config: config/theses/ice-turnkey/jobs.yaml
# Reports: .local/reports/ice-facility-jobs/YYYY-MM-DD-jobs-sweep.md

settings:
  recent_days: 45
  default_radius_miles: 40
  alert_min_signal_score: 6
  excluded_context_keywords:
    corecivic:
      - corporate
      - residential reentry
      - transitional center
    geo:
      - BI Incorporated
      - BI Boulder
      - Boulder
      - corporate
      - ISAP
      - reentry
      - day reporting
      - manufacturing

sources:
  corecivic:
    enabled: true
    operator: CoreCivic
    ticker: CXW
    endpoint: https://jobs.corecivic.com/widgets
    ref_num: CCRCUS
  geo:
    enabled: true
    operator: GEO Group
    ticker: GEO
    endpoint: https://jobs.geogroup.com/api/jobs

