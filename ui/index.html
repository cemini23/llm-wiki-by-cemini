<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cemini AI</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-2: #1c2128;
    --border: #262c36;
    --text: #e6e9ef;
    --text-dim: #8b95a7;
    --accent: #7aa2f7;
    --user: #2b3a55;
    --ok: #5bd17a;
    --bad: #ef6f6c;
    --warn: #e0af68;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
  header h1 .sub { color: var(--text-dim); font-weight: 400; margin-left: 8px; }
  .health { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--text-dim); }
  .health .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim); display: inline-block; margin-right: 4px;
    vertical-align: middle;
  }
  .health .dot.ok { background: var(--ok); }
  .health .dot.bad { background: var(--bad); }
  .health .item { display: flex; align-items: center; }
  .health .status { margin-right: 10px; }
  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .msgs { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word;
    max-width: 85%; line-height: 1.55;
  }
  .bubble.user { background: var(--user); align-self: flex-end; }
  .bubble.ai { background: var(--panel-2); align-self: flex-start; border: 1px solid var(--border); }
  .bubble.error { background: #3a1f22; border: 1px solid #6a2a2e; color: #fbb; align-self: flex-start; }
  .bubble.pending { background: var(--panel-2); border: 1px dashed var(--border); color: var(--text-dim); align-self: flex-start; }
  .bubble.pending .dots::after {
    content: ""; animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } 100% { content: ""; } }
  footer {
    border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px;
  }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font: inherit; min-height: 42px; max-height: 200px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #0f1115; border: 0; padding: 10px 16px;
    border-radius: 10px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { color: var(--text-dim); font-size: 11px; max-width: 820px; margin: 6px auto 0; }
  .empty { color: var(--text-dim); text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
  <header>
    <h1>Cemini AI <span class="sub">cemini-egress-fi / FI</span></h1>
    <div class="health" id="health">
      <span class="status" id="health-status"><span class="dot"></span><span id="health-text">checking…</span></span>
      <span class="item" title="kb-server"><span class="dot" id="dot-kb_server"></span>kb</span>
      <span class="item" title="stash"><span class="dot" id="dot-stash"></span>stash</span>
      <span class="item" title="conductor"><span class="dot" id="dot-conductor"></span>cond</span>
      <span class="item" title="deepseek"><span class="dot" id="dot-deepseek"></span>ds</span>
    </div>
  </header>
  <main>
    <div class="msgs" id="msgs">
      <div class="empty">Type a message to start. Enter to send, Shift+Enter for newline.</div>
    </div>
  </main>
  <footer>
    <div class="composer">
      <textarea id="input" placeholder="Ask Cemini AI…" autofocus></textarea>
      <button id="send">Send</button>
    </div>
    <div class="hint">Latency is typically 3–12 s. Memory is persisted to stash <code>/cemini/ai-gateway</code>.</div>
  </footer>

<script>
const msgsEl = document.getElementById("msgs");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const healthStatusEl = document.getElementById("health-status");
const healthDot = healthStatusEl.querySelector(".dot");
const healthTextEl = document.getElementById("health-text");

const HEALTH_COMPONENTS = ["kb_server", "stash", "conductor", "deepseek"];

let pending = false;
let emptyShown = true;

function clearEmpty() {
  if (!emptyShown) return;
  msgsEl.innerHTML = "";
  emptyShown = false;
}

function addBubble(text, cls) {
  clearEmpty();
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.textContent = text;
  msgsEl.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

function addPending() {
  clearEmpty();
  const div = document.createElement("div");
  div.className = "bubble pending";
  div.innerHTML = '<span class="dots">thinking</span>';
  msgsEl.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function sendMessage() {
  if (pending) return;
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  inputEl.style.height = "auto";
  pending = true;
  sendBtn.disabled = true;

  addBubble(text, "user");
  const placeholder = addPending();

  const t0 = performance.now();
  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const body = await resp.json();
    placeholder.remove();
    if (!resp.ok) {
      const hint = body.hint ? `\n\n${body.hint}` : "";
      addBubble(`Error ${resp.status}: ${body.error || "unknown"}${hint}`, "error");
    } else {
      const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
      addBubble(body.answer || "(empty response)", "ai");
      // proposed_action surfacing kept minimal — just show that one exists
      if (body.proposed_action) {
        addBubble("Proposed action attached: " + JSON.stringify(body.proposed_action), "ai");
      }
      // Footer-style trace line, very small, attached to the AI bubble's parent
      const meta = document.createElement("div");
      meta.style.cssText = "color: var(--text-dim); font-size: 11px; margin: -8px 0 4px 4px; align-self: flex-start;";
      const tr = body.trace || {};
      meta.textContent = `${elapsed}s · kb=${tr.kb_sources ?? "?"} · stash=${tr.stash_episodes ?? "?"} · route=${tr.conductor_taxonomy ?? "?"}`;
      msgsEl.appendChild(meta);
    }
  } catch (e) {
    placeholder.remove();
    addBubble("Network error: " + e.message, "error");
  } finally {
    pending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
});
sendBtn.addEventListener("click", sendMessage);

async function pollHealth() {
  try {
    const resp = await fetch("/health");
    const body = await resp.json();
    const components = body.components || {};
    const allOk = HEALTH_COMPONENTS.every((c) => components[c]);
    healthDot.classList.toggle("ok", allOk);
    healthDot.classList.toggle("bad", !allOk);
    healthTextEl.textContent = allOk ? "all up" : "degraded";
    for (const c of HEALTH_COMPONENTS) {
      const dot = document.getElementById("dot-" + c);
      if (!dot) continue;
      dot.classList.toggle("ok", !!components[c]);
      dot.classList.toggle("bad", components[c] === false);
    }
  } catch (e) {
    healthDot.classList.remove("ok");
    healthDot.classList.add("bad");
    healthTextEl.textContent = "tunnel?";
    for (const c of HEALTH_COMPONENTS) {
      const dot = document.getElementById("dot-" + c);
      if (!dot) continue;
      dot.classList.remove("ok");
      dot.classList.add("bad");
    }
  }
}
pollHealth();
setInterval(pollHealth, 10000);
</script>
</body>
</html>
